name: Build Desktop App

# Builds the offline desktop installers:
#   macOS  → universal .dmg + .app (Intel + Apple Silicon)
#   Windows→ .exe (NSIS) + .msi
# Run manually from the Actions tab, or by pushing a tag like `desktop-v0.1.0`.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'x86_64-apple-darwin,aarch64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - name: Install dependencies
        run: |
          (cd backend && npm install --legacy-peer-deps --no-audit --no-fund)
          (cd frontend && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
      - name: Build (universal .dmg + .app, signed for updates)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop && npm run tauri -- build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: DentoKhata-macOS
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - name: Fetch standalone node.exe (bundled into the app)
        shell: pwsh
        run: |
          curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-win-x64.zip -o node.zip
          Expand-Archive -Force node.zip node-dl
          "NODE_BINARY=$((Resolve-Path node-dl/node-v22.11.0-win-x64/node.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install dependencies
        shell: pwsh
        run: |
          cd backend; npm install --legacy-peer-deps --no-audit --no-fund
          cd ../frontend; npm install --no-audit --no-fund
          cd ../desktop; npm install --no-audit --no-fund
      - name: Build (.exe + .msi, signed for updates)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop; npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: DentoKhata-Windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  # After both builds: generate the update feed and push everything to the server, so all
  # installed apps auto-update. Runs ONLY for a `desktop-vX.Y.Z` tag (never on a code push).
  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Build update feed + upload to server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          mkdir -p upload
          # Rename to STABLE, no-space names (scp-safe + permanent download URLs).
          MAC_TAR=$(find artifacts -name '*.app.tar.gz' | head -1)
          MAC_SIG=$(find artifacts -name '*.app.tar.gz.sig' | head -1)
          MAC_DMG=$(find artifacts -name '*.dmg' | head -1)
          WIN_EXE=$(find artifacts -name '*-setup.exe' | head -1)
          WIN_SIG=$(find artifacts -name '*-setup.exe.sig' | head -1)
          [ -n "$MAC_TAR" ] && cp "$MAC_TAR" upload/DentoKhata.app.tar.gz
          [ -n "$MAC_DMG" ] && cp "$MAC_DMG" upload/DentoKhata.dmg
          [ -n "$WIN_EXE" ] && cp "$WIN_EXE" upload/DentoKhata-setup.exe
          node desktop/scripts/make-update-manifest.mjs "$VERSION" "$(cat "$MAC_SIG" 2>/dev/null)" "$(cat "$WIN_SIG" 2>/dev/null)" https://dento.devcenter.dev/update > upload/latest.json
          echo "Uploading:"; ls -la upload; echo "--- manifest ---"; cat upload/latest.json
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id upload/* dentist@dentist.devcenter.dev:/home/dentist/dento-data/update/
          echo "✅ Published v$VERSION — installed apps will auto-update."
