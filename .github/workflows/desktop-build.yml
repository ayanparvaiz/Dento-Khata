name: Build Desktop App

# Builds the offline installers and publishes them straight to the server (no GitHub artifact
# storage — avoids the artifact quota). macOS → universal .dmg + .app; Windows → .exe.
# Runs ONLY on a `desktop-vX.Y.Z` tag (from `npm run release`) — never on a plain code push.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

env:
  SERVER: dentist@dentist.devcenter.dev
  UPDATE_DIR: /home/dentist/dento-data/update

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'x86_64-apple-darwin,aarch64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - name: Install dependencies
        run: |
          (cd backend && npm install --legacy-peer-deps --no-audit --no-fund)
          (cd frontend && npm install --no-audit --no-fund)
          (cd desktop && npm install --no-audit --no-fund)
      - name: Build (universal .dmg + .app, signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop && npm run tauri -- build --target universal-apple-darwin
      - name: Upload to server staging
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          B=desktop/src-tauri/target/universal-apple-darwin/release/bundle
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/id"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id "$SERVER" "mkdir -p $UPDATE_DIR/staging"
          $SCP "$(ls $B/macos/*.app.tar.gz)" "$SERVER:$UPDATE_DIR/staging/DentoKhata.app.tar.gz"
          $SCP "$(ls $B/macos/*.app.tar.gz.sig)" "$SERVER:$UPDATE_DIR/staging/DentoKhata.app.tar.gz.sig"
          $SCP "$(ls $B/dmg/*.dmg)" "$SERVER:$UPDATE_DIR/staging/DentoKhata.dmg"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - name: Fetch standalone node.exe (bundled into the app)
        shell: pwsh
        run: |
          curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-win-x64.zip -o node.zip
          Expand-Archive -Force node.zip node-dl
          "NODE_BINARY=$((Resolve-Path node-dl/node-v22.11.0-win-x64/node.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install dependencies
        shell: pwsh
        run: |
          cd backend; npm install --legacy-peer-deps --no-audit --no-fund
          cd ../frontend; npm install --no-audit --no-fund
          cd ../desktop; npm install --no-audit --no-fund
      - name: Build (.exe, signed)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd desktop; npm run tauri -- build
      - name: Upload to server staging
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          B=desktop/src-tauri/target/release/bundle/nsis
          SCP="scp -o StrictHostKeyChecking=no -i ~/.ssh/id"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id "$SERVER" "mkdir -p $UPDATE_DIR/staging"
          $SCP "$(ls $B/*-setup.exe)" "$SERVER:$UPDATE_DIR/staging/DentoKhata-setup.exe"
          $SCP "$(ls $B/*-setup.exe.sig)" "$SERVER:$UPDATE_DIR/staging/DentoKhata-setup.exe.sig"

  # Assemble the update feed from the staged files and publish (tag builds only).
  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build latest.json + publish
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/id $SERVER"
          MAC_SIG=$($SSH "cat $UPDATE_DIR/staging/DentoKhata.app.tar.gz.sig")
          WIN_SIG=$($SSH "cat $UPDATE_DIR/staging/DentoKhata-setup.exe.sig")
          node desktop/scripts/make-update-manifest.mjs "$VERSION" "$MAC_SIG" "$WIN_SIG" https://dento.devcenter.dev/update > latest.json
          echo "--- manifest ---"; cat latest.json
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id latest.json "$SERVER:$UPDATE_DIR/latest.json"
          # move staged installers into place (overwrites the stable names), then clean up
          $SSH "cd $UPDATE_DIR && mv -f staging/* . && rmdir staging 2>/dev/null || true; ls -la"
          echo "✅ Published v$VERSION"
